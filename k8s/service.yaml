apiVersion: v1
kind: Service
metadata:
  name: ecommerce-customer
  namespace: npci-ecommerce
  labels: { app.kubernetes.io/name: ecommerce-frontend, app.kubernetes.io/component: customer }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: ecommerce-frontend, app.kubernetes.io/component: customer }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-seller
  namespace: npci-ecommerce
  labels: { app.kubernetes.io/name: ecommerce-frontend, app.kubernetes.io/component: seller }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: ecommerce-frontend, app.kubernetes.io/component: seller }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# The REST backend lives outside the cluster (Render). ExternalName lets the Ingress route /api to it.
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-backend
  namespace: npci-ecommerce
  labels: { app.kubernetes.io/name: ecommerce-backend }
spec:
  type: ExternalName
  externalName: e-commerce-backend-f8v8.onrender.com
  ports:
    - { name: https, port: 443, targetPort: 443 }
