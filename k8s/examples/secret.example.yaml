# EXAMPLE ONLY - not applied by anything and never to be committed with real values.
# deploy.sh creates this Secret from the API_URL environment variable. "/api/" is the same-origin path that the
# Ingress (ingress.yaml) forwards to the backend; a full https:// URL also works for local/dev use.
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-frontend-secret
  namespace: npci-ecommerce
type: Opaque
stringData:
  config.json: |
    {
      "apiUrl": "/api/"
    }
