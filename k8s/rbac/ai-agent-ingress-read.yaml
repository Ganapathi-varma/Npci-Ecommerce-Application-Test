# Read-only access to the ingress controller's pods/logs so the agent can diagnose routing problems.
# Apply only after `minikube addons enable ingress` (the ingress-nginx namespace must exist) - apply.sh does that.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-agent-ingress-read
  namespace: ingress-nginx
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-agent-ingress-read
  namespace: ingress-nginx
subjects:
  - { kind: ServiceAccount, name: ai-agent, namespace: npci-ecommerce }
roleRef:
  kind: Role
  name: ai-agent-ingress-read
  apiGroup: rbac.authorization.k8s.io
