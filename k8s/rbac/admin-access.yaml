# ROLE 1 - YOU (the human admin): full access to everything in the cluster.
# Bound to the identity inside your Minikube client certificate (CN=minikube-user, O=system:masters).
# Minikube already grants that via the system:masters group; this makes the grant explicit and auditable.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: npci-admin-full-access
  labels: { app.kubernetes.io/part-of: npci-ecommerce }
subjects:
  - kind: User
    name: minikube-user
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
